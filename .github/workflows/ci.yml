name: CI

on:
  push:
    branches: [main]
    paths: ['crossmint-solver/**']
  pull_request:
    branches: [main]
    paths: ['crossmint-solver/**']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crossmint-solver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crossmint-solver/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
